// ── Helpers ─────────────────────────────────────────────────
function calcProgress(phases) { const all=phases.flatMap(p=>p.tasks); return Math.round((all.filter(t=>t.status==="done").length/all.length)*100); }
function daysUntil(d) { const diff=Math.ceil((new Date(d)-new Date("2026-04-14"))/86400000); if(diff<0)return"overdue"; if(diff===0)return"today"; if(diff===1)return"tomorrow"; return diff+" days"; }
function formatDate(d) { return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"}); }
function timeAgo(d) { const m=Math.floor((new Date("2026-04-14T10:00:00")-new Date(d))/60000); if(m<60)return m+"m ago"; const h=Math.floor(m/60); if(h<24)return h+"h ago"; return Math.floor(h/24)+"d ago"; }

// ── Notification Bell ───────────────────────────────────────

function NotificationBell({notifications}) {
  const [open,setOpen]=useState(false);
  const [notifs,setNotifs]=useState(notifications);
  const ref=useRef(null);
  const unread=notifs.filter(n=>!n.read).length;
  const icons={progress:"🔨",reminder:"⏰",complete:"✅",message:"💬",welcome:"👋"};

  useEffect(()=>{
    function h(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}
    document.addEventListener("mousedown",h); return()=>document.removeEventListener("mousedown",h);
  },[]);

  return <div ref={ref} style={{position:"relative"}}>
    <button onClick={()=>{setOpen(!open);if(!open&&unread>0)setNotifs(p=>p.map(n=>({...n,read:true})));}} className="btn-press" style={{background:"none",border:"none",cursor:"pointer",padding:6,display:"flex",alignItems:"center",position:"relative"}}>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={unread>0?{animation:"bellRing 0.8s ease"}:{}}>
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      {unread>0 && <span style={{position:"absolute",top:2,right:2,width:16,height:16,borderRadius:"50%",backgroundColor:T.red,color:"#fff",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",animation:"pulse 1.5s ease infinite"}}>{unread}</span>}
    </button>
    {open && <div className="pop-in" style={{position:"absolute",top:36,right:0,width:320,backgroundColor:T.card,borderRadius:T.radius,boxShadow:T.shadowLg,border:"1px solid "+T.border,overflow:"hidden",zIndex:100}}>
      <div style={{padding:"12px 14px",borderBottom:"1px solid "+T.borderLight,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:13,fontWeight:700,color:T.text}}>Notifications</span>
      </div>
      <div style={{maxHeight:320,overflowY:"auto"}}>
        {notifs.map(n=><div key={n.id} style={{padding:"10px 14px",borderBottom:"1px solid "+T.borderLight,backgroundColor:n.read?"transparent":T.tealLight,display:"flex",gap:10,alignItems:"flex-start"}}>
          <span style={{fontSize:14,flexShrink:0,marginTop:1}}>{icons[n.type]||"📌"}</span>
          <div style={{flex:1}}><div style={{fontSize:12,color:T.text,lineHeight:1.4}}>{n.text}</div><div style={{fontSize:10,color:T.textFaint,marginTop:3}}>{timeAgo(n.time)}</div></div>
        </div>)}
      </div>
    </div>}
  </div>;
}

function TaskRow({task,onCycleStatus}) {
  const isDone=task.status==="done"; const due=daysUntil(task.dueDate); const isOverdue=due==="overdue"&&!isDone; const isSoon=(due==="today"||due==="tomorrow")&&!isDone;
  return <div className="slide-in" style={{display:"flex",alignItems:"center",gap:12,padding:"11px 0",borderBottom:"1px solid "+T.borderLight,opacity:isDone?0.5:1,transition:"opacity 0.3s"}}>
    <StatusIcon status={task.status} onClick={()=>onCycleStatus(task.id)}/>
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontSize:13,color:T.text,textDecoration:isDone?"line-through":"none",fontWeight:isDone?400:500}}>{task.text}</div>
      <div style={{display:"flex",gap:6,alignItems:"center",marginTop:4}}>
        <OwnerBadge owner={task.owner}/>
        {isOverdue && <span style={{fontSize:10,color:T.red,fontWeight:600}}>⚠ Overdue</span>}
        {isSoon&&!isOverdue && <span style={{fontSize:10,color:T.amber,fontWeight:600}}>⏰ Due {due}</span>}
        {!isOverdue&&!isSoon&&!isDone && <span style={{fontSize:10,color:T.textFaint}}>{formatDate(task.dueDate)} ({due})</span>}
        {isDone && <span style={{fontSize:10,color:T.textFaint}}>Completed</span>}
      </div>
    </div>
  </div>;
}

function PhaseCard({phase,onCycleStatus,phaseIndex}) {
  const done=phase.tasks.filter(t=>t.status==="done").length; const allDone=done===phase.tasks.length; const pct=Math.round((done/phase.tasks.length)*100);

  return <div className="hover-lift fade-in" style={{backgroundColor:T.card,borderRadius:T.radius,border:"1px solid "+T.border,marginBottom:14,overflow:"hidden",boxShadow:T.shadow,animationDelay:phaseIndex*80+"ms"}}>
    <button onClick={()=>setCollapsed(!collapsed)} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 18px",border:"none",background:allDone?T.greenLight:T.card,cursor:"pointer",textAlign:"left",transition:"background 0.2s"}}>

        <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:28,height:28,borderRadius:"50%",fontSize:12,fontWeight:700,backgroundColor:allDone?T.green:T.teal,color:"#fff",transition:"background 0.3s"}}>{allDone?"✓":phaseIndex+1}</span>

  return <div style={{display:"flex",gap:10,marginBottom:24}}>

function MessagesPanel({clientName}) {
  const [messages,setMessages]=useState(TEST_MESSAGES);const [newMsg,setNewMsg]=useState("");const [filterTask,setFilterTask]=useState("all");
  const endRef=useRef(null);const allTasks=INITIAL_PHASES.flatMap(p=>p.tasks);
  const refs=[...new Set(messages.filter(m=>m.taskRef).map(m=>m.taskRef))];
  const filtered=filterTask==="all"?messages:messages.filter(m=>m.taskRef===filterTask||!m.taskRef);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[messages]);

  function send(){if(!newMsg.trim())return;setMessages(p=>[...p,{id:"m"+Date.now(),sender:"client",senderName:clientName,text:newMsg.trim(),time:new Date().toISOString(),taskRef:null}]);setNewMsg("");}

  return <div className="fade-in" style={{display:"flex",flexDirection:"column",height:"calc(100vh - 130px)"}}>

        {refs.map(tid=>{const task=allTasks.find(t=>t.id===tid);if(!task)return null;return <button key={tid} onClick={()=>setFilterTask(tid)} className="btn-press" style={{padding:"4px 12px",borderRadius:20,border:"1px solid",fontSize:11,cursor:"pointer",backgroundColor:filterTask===tid?T.blue:T.card,color:filterTask===tid?"#fff":T.textSoft,borderColor:filterTask===tid?T.blue:T.border}}>{task.text.length>25?task.text.slice(0,25)+"…":task.text}</button>;})}

        return <div key={msg.id} className="fade-in" style={{display:"flex",flexDirection:"column",alignItems:isOwn?"flex-end":"flex-start",marginBottom:14}}>
          {taskLabel&&<span style={{fontSize:10,color:T.blue,backgroundColor:T.blueLight,padding:"2px 8px",borderRadius:20,marginBottom:4,fontWeight:500}}>Re: {taskLabel.text}</span>}
          <div style={{maxWidth:"78%",padding:"11px 16px",borderRadius:16,backgroundColor:isOwn?T.teal:T.card,color:isOwn?"#fff":T.text,border:isOwn?"none":"1px solid "+T.border,boxShadow:T.shadow,borderBottomRightRadius:isOwn?4:16,borderBottomLeftRadius:isOwn?16:4}}>
            <div style={{fontSize:13,lineHeight:1.55}}>{msg.text}</div>
          </div>
          <div style={{fontSize:10,color:T.textFaint,marginTop:4,display:"flex",gap:6}}><span style={{fontWeight:500,color:T.textMuted}}>{msg.senderName}</span><span>·</span><span>{timeAgo(msg.time)}</span></div>
        </div>;
      })}
      <div ref={endRef}/>
    </div>
    <div style={{display:"flex",gap:8,paddingTop:14,borderTop:"1px solid "+T.borderLight}}>

    </div>
  </div>;
}

      </div>

      {showAuto && <div className="fade-in" style={{marginBottom:24,backgroundColor:T.card,borderRadius:T.radius,border:"1px solid "+T.border,boxShadow:T.shadow,overflow:"hidden"}}>
        <div style={{padding:"14px 18px",borderBottom:"1px solid "+T.borderLight,display:"flex",justifyContent:"space-between"}}><div style={{fontSize:14,fontWeight:700,color:T.text}}>⚡ Automation Log</div><span style={{fontSize:11,color:T.textMuted}}>Last 7 days</span></div>
        {AUTOMATION_LOG.map(a=><div key={a.id} style={{padding:"10px 18px",borderBottom:"1px solid "+T.borderLight,display:"flex",gap:10,alignItems:"center"}}>
          <span style={{fontSize:14,flexShrink:0}}>{ai[a.type]||"⚙️"}</span>
          <div style={{flex:1}}><div style={{fontSize:12,color:T.text}}>{a.text}</div><div style={{fontSize:10,color:T.textFaint,marginTop:2}}>{a.client} · {timeAgo(a.time)}</div></div>
        </div>)}
      </div>}

      {alerts.length>0 && <div className="fade-in" style={{marginBottom:24}}>
        <div style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:10}}>⚠️ Wilting Alerts</div>
        {alerts.map(a=><div key={a.id} className="hover-lift" style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px",backgroundColor:a.health==="red"?T.redLight:T.amberLight,borderRadius:T.radius,border:"1px solid "+(a.health==="red"?T.redBorder:T.amberBorder),marginBottom:8,boxShadow:T.shadow}}>
          <HealthDot health={a.health}/>
          <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:T.text}}>{a.company} <span style={{fontWeight:400,color:T.textMuted}}>({a.name})</span></div><div style={{fontSize:12,color:T.textSoft,marginTop:2}}>{a.msg}</div></div>
          <button className="btn-press" style={{padding:"6px 14px",borderRadius:T.radiusSm,border:"1px solid "+T.border,fontSize:11,fontWeight:600,backgroundColor:T.card,cursor:"pointer",color:T.text}}>View</button>
        </div>)}
      </div>}

      <div style={{marginBottom:28}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:14,fontWeight:700,color:T.text}}>All Clients</div>
          <div style={{display:"flex",gap:4}}>
            {[{id:"all",l:"All"},{id:"green",l:"On track"},{id:"amber",l:"Slowing"},{id:"red",l:"At risk"}].map(f=><button key={f.id} onClick={()=>setCf(f.id)} className="btn-press" style={{padding:"4px 12px",borderRadius:20,border:"1px solid",fontSize:11,cursor:"pointer",backgroundColor:cf===f.id?T.teal:T.card,color:cf===f.id?"#fff":T.textSoft,borderColor:cf===f.id?T.teal:T.border}}>{f.l}</button>)}
          </div>
        </div>
        <div style={{display:"flex",padding:"6px 16px",fontSize:9,color:T.textMuted,textTransform:"uppercase",letterSpacing:"0.8px",fontWeight:700,gap:12}}>
          <div style={{width:10}}/><div style={{flex:1}}>Client</div><div style={{width:72,textAlign:"center"}}>Progress</div><div style={{width:80,textAlign:"center"}}>Phase</div><div style={{width:50,textAlign:"center"}}>Form</div><div style={{width:52}}/>
        </div>
        {fc.map((c,i)=>{const pc=c.progress>=75?T.green:c.progress>=40?T.blue:T.textSoft;return(
          <div key={c.id} className="hover-lift fade-in" style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",backgroundColor:T.card,borderRadius:T.radiusSm,border:"1px solid "+T.border,marginBottom:5,boxShadow:T.shadow,animationDelay:i*40+"ms"}}>
            <HealthDot health={c.health}/>
            <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:T.text}}>{c.company}</div><div style={{fontSize:11,color:T.textMuted,marginTop:1}}>{c.name} · {c.package}</div></div>
            <div style={{width:72,textAlign:"center"}}><div style={{fontSize:13,fontWeight:700,color:pc}}>{c.progress}%</div><div style={{width:48,height:3,backgroundColor:T.borderLight,borderRadius:2,margin:"3px auto 0",overflow:"hidden"}}><div style={{width:c.progress+"%",height:"100%",backgroundColor:pc,borderRadius:2}}/></div></div>
            <div style={{width:80,textAlign:"center"}}><div style={{fontSize:11,color:T.textSoft}}>{c.phase.split(" & ")[0]}</div><div style={{fontSize:10,color:T.textFaint}}>Day {c.daysInOnboarding}</div></div>
            <div style={{width:50,textAlign:"center",fontSize:12,color:T.textSoft}}>{c.detailsComplete}%</div>
            <button className="btn-press" style={{padding:"5px 14px",borderRadius:T.radiusSm,border:"1px solid "+T.border,fontSize:11,fontWeight:500,backgroundColor:T.card,cursor:"pointer",color:T.text}}>Open</button>
          </div>
        );})}
      </div>

      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:14,fontWeight:700,color:T.text}}>Your Team Tasks</div>
          <div style={{display:"flex",gap:4}}>
            {[{id:"all",l:"All"},{id:"overdue",l:"Overdue"},{id:"urgent",l:"Urgent"},{id:"upcoming",l:"Upcoming"}].map(f=><button key={f.id} onClick={()=>setTf(f.id)} className="btn-press" style={{padding:"4px 12px",borderRadius:20,border:"1px solid",fontSize:11,cursor:"pointer",backgroundColor:tf===f.id?T.teal:T.card,color:tf===f.id?"#fff":T.textSoft,borderColor:tf===f.id?T.teal:T.border}}>{f.l}</button>)}
          </div>
        </div>
        {ft.map((t,i)=>{const s=sty[t.status]||sty.upcoming;return(
          <div key={t.id} className="hover-lift fade-in" style={{display:"flex",alignItems:"center",gap:10,padding:"11px 16px",backgroundColor:T.card,borderRadius:T.radiusSm,border:"1px solid "+T.border,marginBottom:5,boxShadow:T.shadow,animationDelay:i*30+"ms"}}>
            <div style={{flex:1}}><div style={{fontSize:13,color:T.text}}>{t.text}</div><div style={{fontSize:10,color:T.textFaint,marginTop:2}}>Due {formatDate(t.dueDate)}</div></div>
            <span style={{fontSize:10,fontWeight:600,padding:"3px 10px",borderRadius:20,backgroundColor:s.bg,color:s.c}}>{s.l}</span>
          </div>
        );})}
        {ft.length===0&&<div className="fade-in" style={{textAlign:"center",padding:24,color:T.textMuted,fontSize:13}}>No tasks match this filter.</div>}
      </div>
    </div>
  </div>;
}

// ── Main App ────────────────────────────────────────────────

function App() {
  const [viewMode,setViewMode]=useState("client");
  const [phases,setPhases]=useState(INITIAL_PHASES);
  const [activeTab,setActiveTab]=useState("plan");
  const [filter,setFilter]=useState("all");
  const progress=calcProgress(phases);

  function cycleStatus(id){setPhases(p=>p.map(ph=>({...ph,tasks:ph.tasks.map(t=>t.id!==id?t:{...t,status:t.status==="todo"?"in-progress":t.status==="in-progress"?"done":"todo"})})));}

  const fp=phases.map(ph=>({...ph,tasks:ph.tasks.filter(t=>filter==="all"||(filter==="client"?(t.owner==="client"||t.owner==="both"):(t.owner==="travelgenix"||t.owner==="both")))})).filter(p=>p.tasks.length>0);

  const togStyle={position:"fixed",bottom:20,right:20,zIndex:999,display:"flex",borderRadius:10,overflow:"hidden",boxShadow:T.shadowLg,border:"1px solid "+T.border};
  const togBtn=(m)=>({padding:"9px 18px",border:"none",fontSize:12,fontWeight:600,cursor:"pointer",backgroundColor:viewMode===m?T.teal:T.card,color:viewMode===m?"#fff":T.textSoft,transition:"all 0.15s"});

  if(viewMode==="admin") return <div>
    <AdminDashboard/>
    <div style={togStyle}><button style={togBtn("client")} onClick={()=>setViewMode("client")} className="btn-press">Client View</button><button style={togBtn("admin")} onClick={()=>setViewMode("admin")} className="btn-press">Admin View</button></div>
  </div>;

  return <div style={{position:"relative"}}>
    <div style={{display:"flex",height:"100%",minHeight:"calc(100vh - 34px)",fontFamily:T.font,backgroundColor:T.bg}}>
      <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} client={TEST_CLIENT}/>
      <div style={{flex:1,overflow:"auto",padding:"28px 36px"}}>
        <div style={{maxWidth:700,margin:"0 auto"}}>
          {activeTab==="plan"&&<>
            <div className="fade-in" style={{marginBottom:28}}>
              <h1 style={{fontSize:24,fontWeight:800,color:T.text,margin:0,letterSpacing:"-0.5px"}}>Good morning, {TEST_CLIENT.name.split(" ")[0]} 👋</h1>
              <p style={{fontSize:14,color:T.textSoft,margin:"6px 0 20px",lineHeight:1.5}}>Here's where things stand with your <strong>{TEST_CLIENT.company}</strong> setup.</p>
              <ProgressBar percent={progress}/>
            </div>
            <QuickStats phases={phases}/>
            <FilterBar filter={filter} setFilter={setFilter}/>
            {fp.map((ph,i)=><PhaseCard key={ph.id} phase={ph} phaseIndex={phases.findIndex(p=>p.id===ph.id)} onCycleStatus={cycleStatus}/>)}
            {progress===100&&<div className="pop-in" style={{textAlign:"center",padding:"36px 20px",backgroundColor:T.greenLight,borderRadius:T.radiusXl,border:"1px solid "+T.greenBorder,marginTop:12}}><div style={{fontSize:44,marginBottom:10}}>🎉</div><div style={{fontSize:20,fontWeight:800,color:T.green}}>You're all set!</div><div style={{fontSize:14,color:T.textSoft,marginTop:6}}>Every task is complete. Welcome to Travelgenix — let's make great things happen.</div></div>}
          </>}
          {activeTab==="details"&&<SmartForm clientPackage={TEST_CLIENT.package}/>}
          {activeTab==="docs"&&<DocumentHub/>}
          {activeTab==="training"&&<div className="fade-in" style={{padding:48,textAlign:"center",color:T.textMuted}}><div style={{fontSize:40,marginBottom:12}}>🎓</div><h2 style={{fontSize:18,fontWeight:600,color:T.textSoft,margin:"0 0 8px"}}>Training</h2><p style={{fontSize:14,lineHeight:1.5}}>Travelgenix University modules will be embedded here, contextually linked to your action plan steps.</p></div>}
          {activeTab==="messages"&&<MessagesPanel clientName={TEST_CLIENT.name}/>}
        </div>
      </div>
    </div>
    <div style={togStyle}><button style={togBtn("client")} onClick={()=>setViewMode("client")} className="btn-press">Client View</button><button style={togBtn("admin")} onClick={()=>setViewMode("admin")} className="btn-press">Admin View</button></div>
  </div>;
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
